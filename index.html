    <style>
      /* Pre-hydration canvas so there is never a white flash, even before React mounts. */
      html,
      body {

        padding: 0;
        background: #05070d;
        color: #e8ecf4;
        overscroll-behavior: none;

      }
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #05070d;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.5em;
        font-size: 12px;
        color: #6b7688;
        transition: opacity 0.6s ease;
